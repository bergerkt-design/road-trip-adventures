<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Road Trip Adventures</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="./manifest.json">
</head>

<body>

    <div id="app">

        <main id="main-content">
            <!-- Page content will appear here -->
        </main>

        <nav id="bottom-nav">
            <button data-page="home">Home</button>
            <button data-page="games">Games</button>
            <button data-page="trips">Trips</button>
            <button data-page="scores">Scores</button>
            <button data-page="more">More</button>
        </nav>

    </div>

    <script src="script.js"></script>
    <script>
    if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
            navigator.serviceWorker.register("./service-worker.js");
        });
    }
</script>
</body>




</html>
